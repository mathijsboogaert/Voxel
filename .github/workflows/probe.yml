name: Probe logs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install --quiet paramiko
          python3 tools/sync_logs.py "$RUNNER_TEMP/logs" >/dev/null
          cd "$RUNNER_TEMP/logs"
          echo "lines with 'playing for':"; (zcat -f *.log.gz latest.log | grep -c "playing for") || true
          echo "sample:"; (zcat -f *.log.gz latest.log | grep "playing for" | head -8 | cut -c1-220) || true
