<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8">
  <!-- Left column: an amber half disc on teal. Right column: a teal half disc on amber. Together they read as a moon. -->
  <rect width="8" height="8" fill="#2a9c8e"/>
  <rect x="4" width="4" height="8" fill="#fdb527"/>
  <path d="M4,0A4,4,0,0,0,4,8Z" fill="#fdb527"/>
  <path d="M8,0A4,4,0,0,0,8,8Z" fill="#2a9c8e"/>
  <g fill="none" stroke="#000" stroke-width=".3" stroke-miterlimit="10">
    <path d="M4,0A4,4,0,0,0,4,8"/>
    <path d="M8,0A4,4,0,0,0,8,8"/>
    <path d="M4,0V8M0,4H8"/>
  </g>
</svg>
