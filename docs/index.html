<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOXEL world map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1d2025;
    --border: #2c3038;
    --text: #e6e8eb;
    --muted: #9aa0a8;
    /* Sampled from the VOXEL logo */
    --brand-teal: #2a9d8f;
    --brand-teal-light: #3dbaa9;
    --brand-orange: #ff9505;
    --brand-gold: #ffb627;
    --brand-rust: #cc5803;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060a; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

  /* ---- Header ------------------------------------------------------- */
  #appHeader {
    flex: 0 0 auto;
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 1100;
  }
  #brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  #brandLogo { height: 40px; width: 40px; flex: none; }
  #brandText { display: flex; flex-direction: column; line-height: 1.1; }
  #brandName {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  #brandSubtitle {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brand-teal-light);
  }

  #zoomButtons { display: flex; gap: 8px; flex: none; }
  .zoom-level-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .zoom-level-btn:hover { background: #2a2e35; }
  .zoom-level-btn.active { background: var(--brand-teal); border-color: var(--brand-teal); color: #fff; }
  .zoom-level-btn.active:hover { background: var(--brand-teal-light); }

  /* ---- Map area ------------------------------------------------------ */
  #mapArea { position: relative; flex: 1 1 auto; min-height: 0; }
  #map { position: absolute; inset: 0; background: #05060a; }
  .leaflet-container { background: #05060a; }
  .biome-tile { image-rendering: pixelated; }

  /* ---- Footer --------------------------------------------------------- */
  #appFooter {
    flex: 0 0 auto;
    height: 40px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    z-index: 1100;
  }
  #footerSeed { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #footerSeed b { color: var(--text); font-weight: 500; }
  #footerHover { color: var(--text); font-weight: 500; white-space: nowrap; flex: none; margin-left: 16px; }

  #zoomIndicator {
    position: absolute; top: 16px; right: 16px; z-index: 1000;
    background: rgba(29,32,37,0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
  }

  .border-label {
    background: rgba(20,22,26,0.85);
    border: none;
    box-shadow: none;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 6px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .border-label::before { display: none; }
</style>
</head>
<body>
<div id="app">
  <header id="appHeader">
    <div id="brand">
      <img src="assets/logo.png" alt="VOXEL logo" id="brandLogo">
      <div id="brandText">
        <span id="brandName">VOXEL</span>
        <span id="brandSubtitle">World map</span>
      </div>
    </div>
    <div id="zoomButtons"></div>
  </header>

  <div id="mapArea">
    <div id="map"></div>
    <div id="zoomIndicator"><span id="zoomBpp">-</span></div>
  </div>

  <footer id="appFooter">
    <div id="footerSeed">loading…</div>
    <div id="footerHover">hover the map</div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="wasm/cubiomes.js"></script>
<script>
// This is the public, read-only viewer: it renders the same map and the
// same web/borders.json as map.html, but has none of that file's drawing
// UI or logic at all (no draw tools, no border editor, no localStorage
// writes) -- there is nothing here for a visitor to edit. map.html is the
// editing tool kept for local use; this is what a hosted deployment
// should point visitors at (e.g. GitHub Pages' root index.html).

// --- World <-> map coordinate convention -----------------------------
// 1 CRS.Simple unit = 4096 blocks. At zoom level NATIVE_ZOOM, that gives
// exactly 1 screen pixel per block (the deepest native detail); each
// zoom level out doubles blocksPerPixel. lat maps to -Z so north stays
// up (Leaflet renders larger lat higher on screen; Minecraft's Z grows
// south).
const UNIT_BLOCKS = 4096;
const NATIVE_ZOOM = 12;
const TILE_SIZE = 256;

// Zoom is restricted to exactly these three levels -- not a continuous
// range. z=11 (blocksPerPixel=2) hit a cubiomes coordinate quirk that
// misaligned tiles from real-world position (see wasm/seedmap_wasm.c);
// rather than trust every in-between level is safe, we only expose the
// specific ones that are, via labeled buttons instead of +/- zoom.
const ALLOWED_ZOOMS = [
  { zoom: 9, label: 'Overview' },
  { zoom: 10, label: 'Normal' },
  { zoom: 12, label: 'Detail' },
];
const MIN_ZOOM = ALLOWED_ZOOMS[0].zoom;
const MAX_ZOOM = ALLOWED_ZOOMS[ALLOWED_ZOOMS.length - 1].zoom;
const DEFAULT_ZOOM = 10;

function blocksPerPixel(zoom) {
  return Math.pow(2, NATIVE_ZOOM - zoom);
}
function worldToLatLng(x, z) {
  return L.latLng(-z / UNIT_BLOCKS, x / UNIT_BLOCKS);
}
function latLngToWorld(latlng) {
  return { x: latlng.lng * UNIT_BLOCKS, z: -latlng.lat * UNIT_BLOCKS };
}

const SEED = '2344567094';

let cubiomes = null;
let seedInitialized = false;

const footerSeedEl = document.getElementById('footerSeed');
const footerHoverEl = document.getElementById('footerHover');

let tileLayer = null;

const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: MIN_ZOOM,
  maxZoom: MAX_ZOOM,
  zoomControl: false,
  attributionControl: false,
  scrollWheelZoom: false,
  doubleClickZoom: false,
  touchZoom: false,
  boxZoom: false,
  keyboard: false,
  zoomAnimation: false,
});
map.setView([0, 0], DEFAULT_ZOOM);

const zoomBppEl = document.getElementById('zoomBpp');
function updateZoomIndicator() {
  const z = map.getZoom();
  zoomBppEl.textContent = `${blocksPerPixel(z).toFixed(2)} blocks/px`;
  document.querySelectorAll('.zoom-level-btn').forEach((btn) => {
    btn.classList.toggle('active', Number(btn.dataset.zoom) === z);
  });
}
map.on('zoom', updateZoomIndicator);

const zoomButtonsEl = document.getElementById('zoomButtons');
zoomButtonsEl.innerHTML = ALLOWED_ZOOMS.map((l) =>
  `<button class="zoom-level-btn" data-zoom="${l.zoom}">${l.label}</button>`
).join('');
zoomButtonsEl.querySelectorAll('.zoom-level-btn').forEach((btn) => {
  btn.addEventListener('click', () => map.setZoom(Number(btn.dataset.zoom)));
});
updateZoomIndicator();

// --- Tile worker pool --------------------------------------------------
// See map.html for why this exists: tile rendering (~150ms-1s per tile)
// runs in a small pool of Web Workers instead of the main thread, so
// panning/hover stay responsive while tiles compute.
const WORKER_COUNT = Math.min(6, Math.max(2, navigator.hardwareConcurrency || 4));
const tileWorkers = [];
let nextWorkerIndex = 0;
let pendingTileId = 0;
const pendingTiles = new Map();

function initTileWorkers(seed) {
  for (let i = 0; i < WORKER_COUNT; i++) {
    const worker = new Worker('wasm/tile-worker.js');
    worker.onmessage = (e) => {
      const msg = e.data;
      if (msg.type === 'ready') return;
      const entry = pendingTiles.get(msg.id);
      if (!entry) return;
      pendingTiles.delete(msg.id);
      entry.resolve(msg.pixels);
    };
    worker.postMessage({ type: 'init', seed });
    tileWorkers.push(worker);
  }
}

function requestTile(worldX0, worldZ0, w, h, bpp) {
  return new Promise((resolve) => {
    const id = pendingTileId++;
    pendingTiles.set(id, { resolve });
    const worker = tileWorkers[nextWorkerIndex];
    nextWorkerIndex = (nextWorkerIndex + 1) % tileWorkers.length;
    worker.postMessage({ type: 'render', id, worldX0, worldZ0, w, h, bpp });
  });
}

const BiomeLayer = L.GridLayer.extend({
  createTile: function (coords, done) {
    const tile = document.createElement('canvas');
    tile.width = TILE_SIZE;
    tile.height = TILE_SIZE;
    tile.className = 'biome-tile';

    if (!seedInitialized) {
      setTimeout(() => done(null, tile), 0);
      return tile;
    }

    const bpp = Math.max(1, Math.round(blocksPerPixel(coords.z)));
    const worldX0 = coords.x * TILE_SIZE * bpp;
    const worldZ0 = coords.y * TILE_SIZE * bpp;

    requestTile(worldX0, worldZ0, TILE_SIZE, TILE_SIZE, bpp)
      .then((pixels) => {
        const imageData = new ImageData(pixels, TILE_SIZE, TILE_SIZE);
        tile.getContext('2d').putImageData(imageData, 0, 0);
        done(null, tile);
      })
      .catch((e) => {
        console.error('tile render failed', e);
        done(null, tile);
      });
    return tile;
  },
});

function loadSeed(seedStr) {
  footerSeedEl.textContent = 'generating…';

  cubiomes.ccall('seed_init', null, ['string'], [seedStr]);
  initTileWorkers(seedStr);
  seedInitialized = true;

  const mcVersion = cubiomes.ccall('get_mc_version', 'string', [], []);
  const spawnX = cubiomes.ccall('get_spawn_x', 'number', [], []);
  const spawnZ = cubiomes.ccall('get_spawn_z', 'number', [], []);

  footerSeedEl.innerHTML =
    `<b>Seed</b> ${seedStr} &nbsp;·&nbsp; <b>Minecraft</b> ${mcVersion} &nbsp;·&nbsp; <b>Spawn</b> X ${spawnX}, Z ${spawnZ}`;

  const spawnLatLng = worldToLatLng(spawnX, spawnZ);
  L.marker(spawnLatLng, {
    icon: L.divIcon({
      className: '',
      html: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))">
        <path d="M12 2C8 2 5 5.2 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.8-3-7-7-7z" fill="#ff4d4f" stroke="#fff" stroke-width="1.2"/>
        <circle cx="12" cy="9" r="2.6" fill="#fff"/>
      </svg>`,
      iconSize: [24, 24],
      iconAnchor: [12, 22],
    }),
  }).addTo(map);

  tileLayer = new BiomeLayer({
    tileSize: TILE_SIZE,
    noWrap: true,
    updateWhenZooming: false,
    maxNativeZoom: NATIVE_ZOOM,
  }).addTo(map);

  map.setView(spawnLatLng, DEFAULT_ZOOM);
}

let hoverPending = false;
map.on('mousemove', (e) => {
  if (!seedInitialized || hoverPending) return;
  hoverPending = true;
  requestAnimationFrame(() => {
    hoverPending = false;
    const w = latLngToWorld(e.latlng);
    const x = Math.round(w.x), z = Math.round(w.z);
    const name = cubiomes.ccall('get_biome_name_at', 'string', ['number', 'number'], [x, z]);
    const biomeText = name ? name.replaceAll('_', ' ') : 'unknown';
    footerHoverEl.textContent = `${biomeText} — X ${x}, Z ${z}`;
  });
});
map.on('mouseout', () => { footerHoverEl.textContent = 'hover the map'; });

// --- Borders (read-only) ----------------------------------------------
// Renders exactly what's in web/borders.json -- no editing, no
// localStorage. That file is the single source of truth both here and
// in map.html.
function pointsToLatLngs(points) {
  return points.map((p) => worldToLatLng(p.x, p.z));
}

function addBorderLayer(points, label, color) {
  const layer = L.polygon(pointsToLatLngs(points), {
    color, weight: 3, fillColor: color, fillOpacity: 0.25,
  }).addTo(map);

  if (!label) return;
  // getCenter() on a closed polygon is its area-weighted centroid, so
  // the label sits in the visual middle of the shape.
  L.tooltip({ permanent: true, direction: 'center', className: 'border-label' })
    .setLatLng(layer.getCenter())
    .setContent(label)
    .addTo(map);
}

async function loadBorders() {
  try {
    const res = await fetch('borders.json', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    for (const b of data) addBorderLayer(b.points, b.label || '', b.color || '#ff4d4f');
  } catch (e) { /* missing/unservable -- just show no borders */ }
}
loadBorders();

footerSeedEl.textContent = 'loading wasm…';
createCubiomesModule().then((mod) => {
  cubiomes = mod;
  loadSeed(SEED);
});
</script>
</body>
</html>
