<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shops · Voxel</title>
<meta name="description" content="Every shop on Voxel, what it sells and for how much. Search by item.">
<meta name="theme-color" content="#faf5ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/brand.css">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../" aria-label="Voxel, home">
      <img class="brand__mark mark--light" src="../assets/logo-mark.png" alt="" width="36" height="36">
      <img class="brand__mark mark--dark" src="../assets/logo-mark-reversed.png" alt="" width="36" height="36">
      <span class="brand__name">Voxel</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="../">Home</a>
      <a href="../map/">Map</a>
      <a href="../players/">Players</a>
      <a href="./" aria-current="page">Shops</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <p class="label eyebrow">Shops</p>
      <h1>What's for sale</h1>
      <p class="small" id="count"></p>
    </div>

    <div class="toolbar">
      <input class="field" id="filter" type="text" inputmode="search" placeholder="Find an item or a shop" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Find an item or a shop">
    </div>

    <ul class="slist" id="slist"></ul>
    <p class="empty" id="none" hidden></p>
  </div>
</main>

<script type="module" src="../js/shops.js"></script>
</body>
</html>
