<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Map · Voxel</title>
    <meta name="description" content="The Voxel world map: borders, shops and spawn." />
    <meta name="theme-color" content="#faf5ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="../assets/favicon.png?v=ad829b4b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="../assets/brand.css?v=ed552aa7" />
    <link rel="stylesheet" href="../assets/site.css?v=8e21ca03" />
    <link rel="stylesheet" href="../assets/map.css?v=26d5d31e" />
  </head>
  <body class="map-page">
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="../" aria-label="Voxel, home">
          <img
            class="brand__mark mark--light"
            src="../assets/logo-mark.png?v=5ef92691"
            alt=""
            width="36"
            height="36"
          />
          <img
            class="brand__mark mark--dark"
            src="../assets/logo-mark-reversed.png?v=11f13e0e"
            alt=""
            width="36"
            height="36"
          />
          <span class="brand__name">Voxel</span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="nav-toggle__open" d="M3 6h18M3 12h18M3 18h18" />
            <path class="nav-toggle__close" d="M5 5l14 14M19 5L5 19" />
          </svg>
        </button>
        <nav class="nav" id="site-nav" aria-label="Main">
          <a href="../">
            <img
              class="nav__icon"
              src="../assets/icons/nav/village.png?v=328b0ab3"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Home</span>
          </a>
          <a href="./" aria-current="page">
            <img
              class="nav__icon"
              src="../assets/icons/nav/map.png?v=b6a9cf2e"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Map</span>
          </a>
          <a href="../players/">
            <img
              class="nav__icon"
              src="../assets/icons/nav/steve.png?v=717ed7db"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Players</span>
          </a>
          <a href="../shops/">
            <img
              class="nav__icon"
              src="../assets/icons/nav/diamond.png?v=f095b32b"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Shops</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="map-main">
      <h1 class="sr-only">Voxel world map</h1>
      <div id="map" role="application" aria-label="Interactive world map"></div>

      <div class="mapui mapui--tr">
        <button class="mapbtn" id="btn-search" aria-label="Search the map" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10" cy="10" r="6.5" />
            <path d="M15 15l6 6" />
          </svg>
        </button>
        <button class="mapbtn" id="btn-spawn" aria-label="Back to spawn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 22C12 22 4.5 14.5 4.5 9.5a7.5 7.5 0 0 1 15 0C19.5 14.5 12 22 12 22Z" />
            <circle cx="12" cy="9.5" r="2.5" />
          </svg>
        </button>
      </div>

      <div class="mapui mapui--br">
        <button class="mapbtn" id="btn-in" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button class="mapbtn" id="btn-out" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
      </div>

      <p class="mapinfo" id="mapinfo" aria-live="off">Loading the map</p>

      <div class="msearch" id="msearch" role="search">
        <div class="msearch__bar">
          <input
            id="search-input"
            type="text"
            inputmode="search"
            enterkeyhint="search"
            placeholder="Search places, players or items"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Search places, players or items"
          />
          <button class="mapbtn" id="search-close" aria-label="Close search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <ul class="msearch__results" id="search-results" role="listbox" aria-label="Results"></ul>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script type="module" src="../js/nav.js?v=0aa91664"></script>
    <script type="module" src="../js/map-page.js?v=acb13a85"></script>
  </body>
</html>
