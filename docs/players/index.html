<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Players · Voxel</title>
    <meta
      name="description"
      content="Everyone who plays on Voxel: playtime, advancements, deaths and badges, with a page for each player."
    />
    <meta name="theme-color" content="#faf5ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="../assets/favicon.png?v=ad829b4b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/brand.css?v=f4ed1d87" />
    <link rel="stylesheet" href="../assets/site.css?v=6b48be04" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="../" aria-label="Voxel, home">
          <picture>
            <source
              srcset="../assets/logo-mark-reversed-small.png?v=c3c00a88"
              media="(prefers-color-scheme: dark)"
            />
            <img
              class="brand__mark"
              src="../assets/logo-mark-small.png?v=800d40a4"
              alt=""
              width="36"
              height="36"
            />
          </picture>
          <span class="brand__name">Voxel</span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="nav-toggle__open" d="M3 6h18M3 12h18M3 18h18" />
            <path class="nav-toggle__close" d="M5 5l14 14M19 5L5 19" />
          </svg>
        </button>
        <nav class="nav" id="site-nav" aria-label="Main">
          <a href="../">
            <img
              class="nav__icon"
              src="../assets/icons/nav/village.png?v=328b0ab3"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Home</span>
          </a>
          <a href="../map/">
            <img
              class="nav__icon"
              src="../assets/icons/nav/map.png?v=b6a9cf2e"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Map + Shops</span>
          </a>
          <a href="../players/" aria-current="page">
            <img
              class="nav__icon"
              src="../assets/icons/nav/steve.png?v=717ed7db"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Players</span>
          </a>
          <a href="../news/">
            <img
              class="nav__icon"
              src="../assets/icons/nav/news.png?v=6bad2801"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">News</span>
          </a>
        </nav>
      </div>
      <nav class="subnav" aria-label="Players">
        <a href="../players/" aria-current="page">Players</a>
        <a href="../badges/">Badges</a>
      </nav>
    </header>

    <main id="main">
      <div class="wrap">
        <div class="page-head">
          <p class="label eyebrow">Players</p>
          <h1>Everyone on Voxel</h1>
          <p class="small" id="count"></p>
        </div>

        <div class="toolbar">
          <div class="psearch">
            <input
              class="field"
              id="filter"
              type="text"
              inputmode="search"
              placeholder="Find a player"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="Find a player"
            />
            <button
              class="btn psearch__toggle"
              type="button"
              id="filters-toggle"
              aria-expanded="false"
              aria-controls="filters"
            >
              Filters
            </button>
          </div>
          <div id="sort"></div>
          <div class="pfilters" id="filters">
            <label class="pfilter">
              <span class="label">Badge</span>
              <select class="field" id="badge">
                <option value="">Any badge</option>
              </select>
            </label>
            <label class="pfilter">
              <span class="label">Advancement</span>
              <input
                class="field"
                id="adv"
                type="text"
                list="adv-list"
                placeholder="Any advancement"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
              />
              <datalist id="adv-list"></datalist>
            </label>
          </div>
        </div>

        <ul class="plist" id="plist">
          <li class="skel skel--pcard" aria-hidden="true"></li>
          <li class="skel skel--pcard" aria-hidden="true"></li>
          <li class="skel skel--pcard" aria-hidden="true"></li>
          <li class="skel skel--pcard" aria-hidden="true"></li>
          <li class="skel skel--pcard" aria-hidden="true"></li>
          <li class="skel skel--pcard" aria-hidden="true"></li>
        </ul>
        <p class="empty" id="none" hidden>
          Nobody matches. <button class="linkbtn" type="button" id="clear">Clear the filters</button>
        </p>
      </div>
    </main>

    <script type="module" src="../js/nav.js?v=0aa91664"></script>
    <script type="module" src="../js/players.js?v=c900cb72"></script>
  </body>
</html>
