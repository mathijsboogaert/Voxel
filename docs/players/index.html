<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Players · Voxel</title>
    <meta
      name="description"
      content="Everyone who plays on Voxel, with their playtime and a page for each player."
    />
    <meta name="theme-color" content="#faf5ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="../assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/brand.css" />
    <link rel="stylesheet" href="../assets/site.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="../" aria-label="Voxel, home">
          <img class="brand__mark mark--light" src="../assets/logo-mark.png" alt="" width="36" height="36" />
          <img
            class="brand__mark mark--dark"
            src="../assets/logo-mark-reversed.png"
            alt=""
            width="36"
            height="36"
          />
          <span class="brand__name">Voxel</span>
        </a>
        <nav class="nav" aria-label="Main">
          <a href="../" title="Home">
            <img class="nav__icon" src="../assets/icons/village.png" alt="" width="32" height="32" />
            <span class="sr-only">Home</span>
          </a>
          <a href="../map/" title="Map">
            <img class="nav__icon" src="../assets/icons/map.png" alt="" width="32" height="32" />
            <span class="sr-only">Map</span>
          </a>
          <a href="./" aria-current="page" title="Players">
            <img class="nav__icon" src="../assets/icons/steve.png" alt="" width="32" height="32" />
            <span class="sr-only">Players</span>
          </a>
          <a href="../shops/" title="Shops">
            <img class="nav__icon" src="../assets/icons/diamond.png" alt="" width="32" height="32" />
            <span class="sr-only">Shops</span>
          </a>
        </nav>
      </div>
    </header>

    <main>
      <div class="wrap">
        <div class="page-head">
          <p class="label eyebrow">Players</p>
          <h1>Everyone on Voxel</h1>
          <p class="small" id="count"></p>
        </div>

        <div class="toolbar">
          <input
            class="field"
            id="filter"
            type="text"
            inputmode="search"
            placeholder="Find a player"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Find a player"
          />
        </div>

        <ul class="plist" id="plist"></ul>
        <p class="empty" id="none" hidden>Nobody by that name.</p>
      </div>
    </main>

    <script type="module" src="../js/players.js"></script>
  </body>
</html>
