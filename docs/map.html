<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOXEL world map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1d2025;
    --border: #2c3038;
    --text: #e6e8eb;
    --muted: #9aa0a8;
    /* Sampled from the VOXEL logo */
    --brand-teal: #2a9d8f;
    --brand-teal-light: #3dbaa9;
    --brand-orange: #ff9505;
    --brand-gold: #ffb627;
    --brand-rust: #cc5803;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060a; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

  /* ---- Header ------------------------------------------------------- */
  #appHeader {
    flex: 0 0 auto;
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 1100;
  }
  #brand { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; min-width: 0; }
  #brandLogo { height: 40px; width: 40px; flex: none; }
  #brandText { display: flex; flex-direction: column; line-height: 1.1; white-space: nowrap; overflow: hidden; }
  #brandName {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  #brandSubtitle {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brand-teal-light);
  }

  #headerActions { display: flex; align-items: center; gap: 12px; flex: 1 1 auto; min-width: 0; justify-content: flex-end; }

  /* Collapsed to a round icon button by default; clicking it expands
     #searchWrap to fill the header (see #appHeader.search-open below),
     which hides the logo and "Return to spawn" button until the search
     is closed again. */
  #searchWrap { position: relative; display: flex; align-items: center; justify-content: flex-end; flex: 1 1 auto; max-width: 520px; }
  #searchIconBtn {
    width: 36px; height: 36px; flex: none; padding: 0;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #searchIconBtn:hover { background: var(--brand-teal); border-color: var(--brand-teal); color: #fff; }
  #searchIconBtn svg { width: 16px; height: 16px; }
  #searchWrap.expanded #searchIconBtn { display: none; }

  #searchInputRow { display: none; position: relative; align-items: center; flex: 1 1 auto; }
  #searchWrap.expanded #searchInputRow { display: flex; }
  #searchInput {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 8px 34px 8px 14px; font-size: 13px;
  }
  #searchInput::placeholder { color: var(--muted); }
  #searchInput:focus { outline: none; border-color: var(--brand-teal); }
  #searchCloseBtn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; flex: none; padding: 0;
    background: transparent; border: none; color: var(--muted);
    border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #searchCloseBtn:hover { background: #2a2e35; color: #fff; }
  #searchCloseBtn svg { width: 12px; height: 12px; }

  #appHeader.search-open #brand,
  #appHeader.search-open #returnToSpawnBtn { display: none; }

  #searchResults {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    max-height: 280px; overflow-y: auto; display: none; z-index: 1300;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #searchResults.open { display: block; }
  .search-result { padding: 8px 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .search-result .result-icon { width: 14px; height: 14px; flex: none; border-radius: 3px; }
  .search-result:hover, .search-result.active { background: #2a2e35; }
  .search-empty { padding: 10px 12px; font-size: 12.5px; color: var(--muted); }

  #returnToSpawnBtn {
    display: flex; align-items: center; gap: 8px; flex: none;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 8px 16px 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  #returnToSpawnBtn:hover { background: var(--brand-teal); border-color: var(--brand-teal); color: #fff; }
  #returnToSpawnBtn svg { width: 15px; height: 15px; flex: none; }

  /* ---- Map area ------------------------------------------------------ */
  #mapArea { position: relative; flex: 1 1 auto; min-height: 0; }
  #map { position: absolute; inset: 0; background: #05060a; }
  .leaflet-container { background: #05060a; }
  .biome-tile { image-rendering: pixelated; }

  /* Pixel art shop icon -- nearest-neighbor scaling keeps its edges crisp
     instead of letting the browser smooth/blur it like a photo. */
  .shop-marker-icon {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  .shop-popup .leaflet-popup-content-wrapper {
    background: rgba(20,22,26,0.92);
    color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .shop-popup .leaflet-popup-content {
    margin: 6px 10px;
    font-size: 12.5px;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .shop-popup .leaflet-popup-tip { background: rgba(20,22,26,0.92); }

  /* ---- Footer --------------------------------------------------------- */
  #appFooter {
    flex: 0 0 auto;
    height: 40px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    z-index: 1100;
  }
  #footerSeed { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #footerSeed b { color: var(--text); font-weight: 500; }
  #footerHover { color: var(--text); font-weight: 500; white-space: nowrap; flex: none; margin-left: 16px; }

  #zoomIndicator {
    position: absolute; top: 16px; right: 16px; z-index: 1000;
    background: rgba(29,32,37,0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
  }

  #drawTools {
    position: absolute; top: 68px; right: 16px; z-index: 1000;
    background: rgba(29,32,37,0.92);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    display: flex; flex-direction: column; gap: 6px;
    width: 180px;
    backdrop-filter: blur(6px);
  }
  #drawTools button {
    background: #2a2e35; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: pointer;
    text-align: left;
  }
  #drawTools button:hover { background: #363b44; }
  #drawTools button:disabled { opacity: 0.4; cursor: default; }
  #drawTools button.active { background: var(--brand-orange); border-color: var(--brand-orange); color: #1a1200; }
  #drawTools button.active:hover { background: var(--brand-gold); }
  #drawTools .hint { font-size: 10.5px; color: var(--muted); line-height: 1.4; }
  #drawTools .tool-divider { border-top: 1px solid var(--border); margin: 2px 0; }

  .leaflet-container.drawing-mode { cursor: crosshair; }

  .border-label {
    background: rgba(20,22,26,0.85);
    border: none;
    box-shadow: none;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 6px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .border-label::before { display: none; }

  .leaflet-interactive.border-line { cursor: pointer; }

  #borderEditor {
    position: absolute; top: 68px; right: 206px; z-index: 1001;
    background: rgba(29,32,37,0.96);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    width: 200px;
    backdrop-filter: blur(6px);
    display: none;
  }
  #borderEditor.open { display: block; }
  #borderEditor h2 { font-size: 12px; margin: 0 0 8px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #borderLabelInput {
    width: 100%; background: #101216; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; margin-bottom: 10px;
  }
  #colorSwatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .swatch-btn {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch-btn.selected { border-color: #fff; }
  #borderEditorActions { display: flex; gap: 6px; }
  #borderEditorActions button {
    flex: 1; background: #2a2e35; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: pointer;
  }
  #borderEditorActions button:hover { background: #363b44; }
  #borderSave { background: var(--brand-teal); border-color: var(--brand-teal); color: #fff; }
  #borderSave:hover { background: var(--brand-teal-light); }
  #borderDelete { color: #ff6b6b; }

  #shopEditor {
    position: absolute; top: 68px; right: 206px; z-index: 1001;
    background: rgba(29,32,37,0.96);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    width: 200px;
    backdrop-filter: blur(6px);
    display: none;
  }
  #shopEditor.open { display: block; }
  #shopEditor h2 { font-size: 12px; margin: 0 0 8px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #shopLabelInput {
    width: 100%; background: #101216; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; margin-bottom: 10px;
  }
  #shopEditorActions { display: flex; gap: 6px; }
  #shopEditorActions button {
    flex: 1; background: #2a2e35; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: pointer;
  }
  #shopEditorActions button:hover { background: #363b44; }
  #shopSave { background: var(--brand-teal); border-color: var(--brand-teal); color: #fff; }
  #shopSave:hover { background: var(--brand-teal-light); }
  #shopDelete { color: #ff6b6b; }
</style>
</head>
<body>
<div id="app">
  <header id="appHeader">
    <div id="brand">
      <img src="assets/logo.png" alt="VOXEL logo" id="brandLogo">
      <div id="brandText">
        <span id="brandName">VOXEL</span>
        <span id="brandSubtitle">World map</span>
      </div>
    </div>
    <div id="headerActions">
      <div id="searchWrap">
        <button id="searchIconBtn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <div id="searchInputRow">
          <input id="searchInput" type="text" placeholder="Search borders & shops…" autocomplete="off">
          <button id="searchCloseBtn" aria-label="Close search">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div id="searchResults"></div>
      </div>
      <button id="returnToSpawnBtn">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8 2 5 5.2 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.8-3-7-7-7z" fill="#ff4d4f"/>
          <circle cx="12" cy="9" r="2.6" fill="#fff"/>
        </svg>
        Return to spawn
      </button>
    </div>
  </header>

  <div id="mapArea">
    <div id="map"></div>
    <div id="zoomIndicator"><span id="zoomBpp">-</span></div>

    <div id="drawTools">
      <button id="drawToggle">Draw border</button>
      <button id="drawFinish" disabled>Finish line</button>
      <button id="drawUndo" disabled>Undo point</button>
      <button id="drawClear">Clear all</button>
      <div class="tool-divider"></div>
      <button id="shopToggle">Place shop</button>
      <button id="shopClear">Clear all shops</button>
      <div class="tool-divider"></div>
      <button id="drawExport">Export borders.json</button>
      <button id="shopExport">Export shops.json</button>
      <div class="hint" id="drawHint">Click to add points, snapped to the world's pixel grid. Shops are placed with a single click. Export each file when done, then drop it into docs/ so it ships with the site.</div>
    </div>

    <div id="borderEditor">
      <h2>Border</h2>
      <input id="borderLabelInput" type="text" placeholder="Label" maxlength="40">
      <div id="colorSwatches"></div>
      <div id="borderEditorActions">
        <button id="borderDelete">Delete</button>
        <button id="borderCancel">Cancel</button>
        <button id="borderSave">Save</button>
      </div>
    </div>

    <div id="shopEditor">
      <h2>Shop</h2>
      <input id="shopLabelInput" type="text" placeholder="Shop name" maxlength="40">
      <div id="shopEditorActions">
        <button id="shopDelete">Delete</button>
        <button id="shopCancel">Cancel</button>
        <button id="shopSave">Save</button>
      </div>
    </div>
  </div>

  <footer id="appFooter">
    <div id="footerSeed">loading…</div>
    <div id="footerHover">hover the map</div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="wasm/cubiomes.js"></script>
<script>
// --- World <-> map coordinate convention -----------------------------
// 1 CRS.Simple unit = 4096 blocks. At zoom level NATIVE_ZOOM, that gives
// exactly 1 screen pixel per block (the deepest native detail); each
// zoom level out doubles blocksPerPixel. lat maps to -Z so north stays
// up (Leaflet renders larger lat higher on screen; Minecraft's Z grows
// south).
const UNIT_BLOCKS = 4096;
const NATIVE_ZOOM = 12;
const TILE_SIZE = 256;

// Zoom used to be locked to exactly these three levels: z=11
// (blocksPerPixel=2) hit a cubiomes coordinate quirk that misaligned
// tiles from their real-world position, and the renderer at the time
// went through cubiomes' Range/genBiomes for every zoom level, so every
// in-between/fractional level was a potential unknown. Both of those
// are gone now -- the renderer was rewritten to sample real terrain
// height directly (see wasm/seedmap_wasm.c) and no longer calls
// Range/genBiomes at all, so there's no scale-dependent path left for
// that bug to live in. Verified z=11 and fractional zooms (e.g. 10.5)
// render correctly aligned before re-enabling free zoom.
const MIN_ZOOM = 0;
const MAX_ZOOM = 16; // beyond NATIVE_ZOOM (12), Leaflet just upscales the last real tile
const DEFAULT_ZOOM = 10;

function blocksPerPixel(zoom) {
  return Math.pow(2, NATIVE_ZOOM - zoom);
}
function worldToLatLng(x, z) {
  return L.latLng(-z / UNIT_BLOCKS, x / UNIT_BLOCKS);
}
function latLngToWorld(latlng) {
  return { x: latlng.lng * UNIT_BLOCKS, z: -latlng.lat * UNIT_BLOCKS };
}

const SEED = '2344567094';

let cubiomes = null;
let seedInitialized = false;

const footerSeedEl = document.getElementById('footerSeed');
const footerHoverEl = document.getElementById('footerHover');

let tileLayer = null;

const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: MIN_ZOOM,
  maxZoom: MAX_ZOOM,
  // Continuous zoom, not integer steps -- lets scroll/pinch feel smooth
  // instead of snapping between whole levels.
  zoomSnap: 0,
  zoomDelta: 1,
  wheelPxPerZoomLevel: 100,
  zoomControl: false,
  attributionControl: false,
  scrollWheelZoom: true,
  doubleClickZoom: true,
  touchZoom: true, // pinch-to-zoom on touch/mobile
  boxZoom: true,
  keyboard: true,
  // Tile rendering used to run synchronously on the main thread, which
  // could block long enough during a zoom gesture to desync Leaflet's
  // animated zoom transform from the actual viewport. It now runs in a
  // pool of Web Workers (below) instead, so the main thread -- and
  // Leaflet's own zoom animation -- is never blocked by it; re-enabling
  // the animation here is what makes zoom feel smooth rather than
  // snapping instantly between levels.
  zoomAnimation: true,
});
map.setView([0, 0], DEFAULT_ZOOM);

const zoomBppEl = document.getElementById('zoomBpp');
function updateZoomIndicator() {
  const z = map.getZoom();
  zoomBppEl.textContent = `${blocksPerPixel(z).toFixed(2)} blocks/px`;
}
map.on('zoom', updateZoomIndicator);
updateZoomIndicator();

// Set once loadSeed() knows the real spawn point; falls back to world
// origin if clicked before the seed has finished loading.
let spawnLatLngForReturn = L.latLng(0, 0);
document.getElementById('returnToSpawnBtn').addEventListener('click', () => {
  map.setView(spawnLatLngForReturn, DEFAULT_ZOOM);
});

// --- Tile worker pool --------------------------------------------------
// A single tile can take ~150ms (native resolution) to over 1s
// (supersampled, zoomed-out) to compute, and render_tile calls straight
// into the WASM module, which runs synchronously. Doing that on the main
// thread would freeze panning/zooming/hover for as long as tiles take to
// render. Each worker below loads its own cubiomes module instance and
// seeds it independently, so tile requests run off the main thread and
// spread across up to hardwareConcurrency workers in parallel.
const WORKER_COUNT = Math.min(6, Math.max(2, navigator.hardwareConcurrency || 4));
const tileWorkers = [];
let nextWorkerIndex = 0;
let pendingTileId = 0;
const pendingTiles = new Map(); // id -> {resolve}

function initTileWorkers(seed) {
  for (let i = 0; i < WORKER_COUNT; i++) {
    const worker = new Worker('wasm/tile-worker.js');
    worker.onmessage = (e) => {
      const msg = e.data;
      if (msg.type === 'ready') return;
      const entry = pendingTiles.get(msg.id);
      if (!entry) return;
      pendingTiles.delete(msg.id);
      entry.resolve(msg.pixels);
    };
    worker.postMessage({ type: 'init', seed });
    tileWorkers.push(worker);
  }
}

function requestTile(worldX0, worldZ0, w, h, bpp) {
  return new Promise((resolve) => {
    const id = pendingTileId++;
    pendingTiles.set(id, { resolve });
    const worker = tileWorkers[nextWorkerIndex];
    nextWorkerIndex = (nextWorkerIndex + 1) % tileWorkers.length;
    worker.postMessage({ type: 'render', id, worldX0, worldZ0, w, h, bpp });
  });
}

const BiomeLayer = L.GridLayer.extend({
  createTile: function (coords, done) {
    const tile = document.createElement('canvas');
    tile.width = TILE_SIZE;
    tile.height = TILE_SIZE;
    tile.className = 'biome-tile';

    if (!seedInitialized) {
      setTimeout(() => done(null, tile), 0);
      return tile;
    }

    const bpp = Math.max(1, Math.round(blocksPerPixel(coords.z)));
    const worldX0 = coords.x * TILE_SIZE * bpp;
    const worldZ0 = coords.y * TILE_SIZE * bpp;

    requestTile(worldX0, worldZ0, TILE_SIZE, TILE_SIZE, bpp)
      .then((pixels) => {
        const imageData = new ImageData(pixels, TILE_SIZE, TILE_SIZE);
        tile.getContext('2d').putImageData(imageData, 0, 0);
        done(null, tile);
      })
      .catch((e) => {
        console.error('tile render failed', e);
        done(null, tile);
      });
    return tile;
  },
});

function loadSeed(seedStr) {
  footerSeedEl.textContent = 'generating…';

  cubiomes.ccall('seed_init', null, ['string'], [seedStr]);
  initTileWorkers(seedStr);
  seedInitialized = true;

  const mcVersion = cubiomes.ccall('get_mc_version', 'string', [], []);
  const spawnX = cubiomes.ccall('get_spawn_x', 'number', [], []);
  const spawnZ = cubiomes.ccall('get_spawn_z', 'number', [], []);

  footerSeedEl.innerHTML =
    `<b>Seed</b> ${seedStr} &nbsp;·&nbsp; <b>Minecraft</b> ${mcVersion} &nbsp;·&nbsp; <b>Spawn</b> X ${spawnX}, Z ${spawnZ}`;

  const spawnLatLng = worldToLatLng(spawnX, spawnZ);
  spawnLatLngForReturn = spawnLatLng;
  L.marker(spawnLatLng, {
    icon: L.divIcon({
      className: '',
      html: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))">
        <path d="M12 2C8 2 5 5.2 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.8-3-7-7-7z" fill="#ff4d4f" stroke="#fff" stroke-width="1.2"/>
        <circle cx="12" cy="9" r="2.6" fill="#fff"/>
      </svg>`,
      iconSize: [24, 24],
      iconAnchor: [12, 22],
    }),
  }).addTo(map);

  tileLayer = new BiomeLayer({
    tileSize: TILE_SIZE,
    noWrap: true,
    updateWhenZooming: false,
    maxNativeZoom: NATIVE_ZOOM,
  }).addTo(map);

  map.setView(spawnLatLng, DEFAULT_ZOOM);
}

let hoverPending = false;
map.on('mousemove', (e) => {
  if (!seedInitialized || hoverPending) return;
  hoverPending = true;
  requestAnimationFrame(() => {
    hoverPending = false;
    const w = latLngToWorld(e.latlng);
    const x = Math.round(w.x), z = Math.round(w.z);
    const name = cubiomes.ccall('get_biome_name_at', 'string', ['number', 'number'], [x, z]);
    const biomeText = name ? name.replaceAll('_', ' ') : 'unknown';
    footerHoverEl.textContent = `${biomeText} — X ${x}, Z ${z}`;
  });
});
map.on('mouseout', () => { footerHoverEl.textContent = 'hover the map'; });

// --- Border drawing layer --------------------------------------------
// Borders are drawn as vector polylines whose vertices are snapped to
// GRID_BLOCKS (the same 4-block cell size the biome raster is rendered
// at), so lines land exactly on the biome pixel grid rather than at
// arbitrary sub-pixel positions.
const GRID_BLOCKS = 4;
const STORAGE_KEY = `voxel-map-borders:${SEED}`;

const drawToggleBtn = document.getElementById('drawToggle');
const drawFinishBtn = document.getElementById('drawFinish');
const drawUndoBtn = document.getElementById('drawUndo');
const drawClearBtn = document.getElementById('drawClear');

const PALETTE = ['#ff4d4f', '#ffa94d', '#ffd43b', '#69db7c', '#38d9a9', '#4dabf7', '#748ffc', '#e599f7', '#ffffff'];
let nextColorIndex = 0;

let drawMode = false;
let activePoints = [];   // [{x,z}, ...] snapped world coords, in progress
let activeLine = null;   // L.Polyline for the in-progress line
let activeMarkers = [];  // L.CircleMarker per vertex of the in-progress line
let borders = [];        // [{points, label, color, layer, labelTooltip}, ...]

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function snapWorld(x, z) {
  return {
    x: Math.round(x / GRID_BLOCKS) * GRID_BLOCKS,
    z: Math.round(z / GRID_BLOCKS) * GRID_BLOCKS,
  };
}
function pointsToLatLngs(points) {
  return points.map((p) => worldToLatLng(p.x, p.z));
}

function renderActiveLine() {
  const latlngs = pointsToLatLngs(activePoints);

  if (activeLine) map.removeLayer(activeLine);
  activeLine = latlngs.length >= 2
    ? L.polygon(latlngs, {
        color: '#ffd23f', weight: 2, dashArray: '6 5', fillColor: '#ffd23f', fillOpacity: 0.15,
      }).addTo(map)
    : null;

  activeMarkers.forEach((m) => map.removeLayer(m));
  activeMarkers = latlngs.map((ll) => L.circleMarker(ll, {
    radius: 4, color: '#ffd23f', weight: 2, fillColor: '#1d2025', fillOpacity: 1,
  }).addTo(map));

  drawFinishBtn.disabled = activePoints.length < 2;
  drawUndoBtn.disabled = activePoints.length === 0;
}

function updateLabelTooltip(border) {
  if (border.labelTooltip) { map.removeLayer(border.labelTooltip); border.labelTooltip = null; }
  if (!border.label) return;
  // getCenter() on a closed polygon is its area-weighted centroid, not
  // just an average of vertices, so the label sits in the visual middle
  // of the highlighted area rather than drifting toward wherever points
  // happen to be denser.
  border.labelTooltip = L.tooltip({
    permanent: true, direction: 'center', className: 'border-label', interactive: true,
  })
    .setLatLng(border.layer.getCenter())
    .setContent(border.label)
    .addTo(map);
  border.labelTooltip.on('click', () => openBorderEditor(border));
}

function addBorderLayer(points, label, color) {
  const layer = L.polygon(pointsToLatLngs(points), {
    color, weight: 3, fillColor: color, fillOpacity: 0.25, className: 'border-line',
  }).addTo(map);
  const border = { points, label, color, layer, labelTooltip: null };
  layer.on('click', (e) => { L.DomEvent.stopPropagation(e); openBorderEditor(border); });
  updateLabelTooltip(border);
  borders.push(border);
  return border;
}

function saveBorders() {
  const data = borders.map((b) => ({ points: b.points, label: b.label, color: b.color }));
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
}

async function loadBorders() {
  // borders.json is the checked-in, shipped snapshot (what everyone who
  // opens this page sees, including once it's hosted). localStorage is
  // just a local editing convenience/fallback if that file is missing or
  // empty -- e.g. mid-session before you've exported yet.
  let data = null;
  try {
    const res = await fetch('borders.json', { cache: 'no-store' });
    if (res.ok) data = await res.json();
  } catch (e) { /* not servable (e.g. file://) or missing -- fall back below */ }

  if (!Array.isArray(data) || data.length === 0) {
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { data = []; }
  }

  for (const b of data) addBorderLayer(b.points, b.label || '', b.color || PALETTE[0]);
  nextColorIndex = data.length % PALETTE.length;
}

function exportBorders() {
  const data = borders.map((b) => ({ points: b.points, label: b.label, color: b.color }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'borders.json';
  a.click();
  URL.revokeObjectURL(url);
}

// --- Shop points --------------------------------------------------------
// Unlike borders, shops are single points placed with one click and
// rendered as a small pixel-art icon. Their name is hidden until clicked
// (editor here, popup on the read-only public page) rather than shown as
// a permanent label like border names.
const SHOP_STORAGE_KEY = `voxel-map-shops:${SEED}`;
const shopIcon = L.icon({
  iconUrl: 'assets/shop-icon.png',
  className: 'shop-marker-icon',
  iconSize: [28, 28],
  iconAnchor: [14, 14],
  popupAnchor: [0, -16],
});
let shops = []; // [{x, z, label, marker}, ...]

function addShopLayer(x, z, label) {
  const marker = L.marker(worldToLatLng(x, z), { icon: shopIcon }).addTo(map);
  const shop = { x, z, label, marker };
  marker.on('click', (e) => { L.DomEvent.stopPropagation(e); openShopEditor(shop); });
  shops.push(shop);
  return shop;
}

function saveShops() {
  const data = shops.map((s) => ({ x: s.x, z: s.z, label: s.label }));
  try { localStorage.setItem(SHOP_STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
}

async function loadShops() {
  let data = null;
  try {
    const res = await fetch('shops.json', { cache: 'no-store' });
    if (res.ok) data = await res.json();
  } catch (e) { /* not servable or missing -- fall back below */ }

  if (!Array.isArray(data) || data.length === 0) {
    try { data = JSON.parse(localStorage.getItem(SHOP_STORAGE_KEY) || '[]'); } catch (e) { data = []; }
  }

  for (const s of data) addShopLayer(s.x, s.z, s.label || '');
}

function exportShops() {
  const data = shops.map((s) => ({ x: s.x, z: s.z, label: s.label }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'shops.json';
  a.click();
  URL.revokeObjectURL(url);
}

function clearAllShops() {
  for (const s of shops) map.removeLayer(s.marker);
  shops = [];
  saveShops();
  closeShopEditor();
}

function finishActiveLine() {
  if (activePoints.length >= 2) {
    const label = `Border ${borders.length + 1}`;
    const color = PALETTE[nextColorIndex % PALETTE.length];
    nextColorIndex++;
    const border = addBorderLayer(activePoints, label, color);
    saveBorders();
    openBorderEditor(border);
  }
  activePoints = [];
  renderActiveLine();
}

function undoPoint() {
  activePoints.pop();
  renderActiveLine();
}

function clearAllBorders() {
  activePoints = [];
  renderActiveLine();
  for (const b of borders) {
    map.removeLayer(b.layer);
    if (b.labelTooltip) map.removeLayer(b.labelTooltip);
  }
  borders = [];
  saveBorders();
  closeBorderEditor();
}

// --- Border label/color editor ----------------------------------------
const borderEditorEl = document.getElementById('borderEditor');
const borderLabelInput = document.getElementById('borderLabelInput');
const colorSwatchesEl = document.getElementById('colorSwatches');
const borderSaveBtn = document.getElementById('borderSave');
const borderDeleteBtn = document.getElementById('borderDelete');
const borderCancelBtn = document.getElementById('borderCancel');

let editingBorder = null;
let editingColor = null;

colorSwatchesEl.innerHTML = PALETTE.map((c) =>
  `<div class="swatch-btn" data-color="${c}" style="background:${c}"></div>`
).join('');
colorSwatchesEl.querySelectorAll('.swatch-btn').forEach((el) => {
  el.addEventListener('click', () => {
    editingColor = el.dataset.color;
    colorSwatchesEl.querySelectorAll('.swatch-btn').forEach((s) => s.classList.remove('selected'));
    el.classList.add('selected');
  });
});

function openBorderEditor(border) {
  closeShopEditor();
  editingBorder = border;
  editingColor = border.color;
  borderLabelInput.value = border.label || '';
  colorSwatchesEl.querySelectorAll('.swatch-btn').forEach((s) => {
    s.classList.toggle('selected', s.dataset.color === border.color);
  });
  borderEditorEl.classList.add('open');
  borderLabelInput.focus();
  borderLabelInput.select();
}

function closeBorderEditor() {
  editingBorder = null;
  borderEditorEl.classList.remove('open');
}

borderSaveBtn.addEventListener('click', () => {
  if (!editingBorder) return;
  editingBorder.label = borderLabelInput.value.trim();
  editingBorder.color = editingColor;
  editingBorder.layer.setStyle({ color: editingColor, fillColor: editingColor });
  updateLabelTooltip(editingBorder);
  saveBorders();
  closeBorderEditor();
});
borderDeleteBtn.addEventListener('click', () => {
  if (!editingBorder) return;
  map.removeLayer(editingBorder.layer);
  if (editingBorder.labelTooltip) map.removeLayer(editingBorder.labelTooltip);
  borders = borders.filter((b) => b !== editingBorder);
  saveBorders();
  closeBorderEditor();
});
borderCancelBtn.addEventListener('click', closeBorderEditor);
borderLabelInput.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'Enter') borderSaveBtn.click();
  else if (e.key === 'Escape') closeBorderEditor();
});

// --- Shop label editor --------------------------------------------------
const shopEditorEl = document.getElementById('shopEditor');
const shopLabelInput = document.getElementById('shopLabelInput');
const shopSaveBtn = document.getElementById('shopSave');
const shopDeleteBtn = document.getElementById('shopDelete');
const shopCancelBtn = document.getElementById('shopCancel');

let editingShop = null;

function openShopEditor(shop) {
  closeBorderEditor();
  editingShop = shop;
  shopLabelInput.value = shop.label || '';
  shopEditorEl.classList.add('open');
  shopLabelInput.focus();
  shopLabelInput.select();
}

function closeShopEditor() {
  editingShop = null;
  shopEditorEl.classList.remove('open');
}

shopSaveBtn.addEventListener('click', () => {
  if (!editingShop) return;
  editingShop.label = shopLabelInput.value.trim();
  saveShops();
  closeShopEditor();
});
shopDeleteBtn.addEventListener('click', () => {
  if (!editingShop) return;
  map.removeLayer(editingShop.marker);
  shops = shops.filter((s) => s !== editingShop);
  saveShops();
  closeShopEditor();
});
shopCancelBtn.addEventListener('click', () => {
  // A freshly-placed shop with no name yet shouldn't be left behind as an
  // unlabeled marker just because the editor was dismissed.
  if (editingShop && !editingShop.label) {
    map.removeLayer(editingShop.marker);
    shops = shops.filter((s) => s !== editingShop);
    saveShops();
  }
  closeShopEditor();
});
shopLabelInput.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'Enter') shopSaveBtn.click();
  else if (e.key === 'Escape') shopCancelBtn.click();
});

const shopToggleBtn = document.getElementById('shopToggle');
let shopMode = false;

function setDrawMode(on) {
  drawMode = on;
  drawToggleBtn.classList.toggle('active', on);
  drawToggleBtn.textContent = on ? 'Drawing…' : 'Draw border';
  map.getContainer().classList.toggle('drawing-mode', on);
  if (on) {
    map.doubleClickZoom.disable();
    setShopMode(false);
  } else {
    map.doubleClickZoom.enable();
    finishActiveLine();
  }
}

function setShopMode(on) {
  shopMode = on;
  shopToggleBtn.classList.toggle('active', on);
  shopToggleBtn.textContent = on ? 'Click map to place…' : 'Place shop';
  map.getContainer().classList.toggle('drawing-mode', on || drawMode);
  if (on) setDrawMode(false);
}

map.on('click', (e) => {
  if (drawMode) {
    const w = latLngToWorld(e.latlng);
    activePoints.push(snapWorld(w.x, w.z));
    renderActiveLine();
    return;
  }
  if (shopMode) {
    const w = latLngToWorld(e.latlng);
    const snapped = snapWorld(w.x, w.z);
    const shop = addShopLayer(snapped.x, snapped.z, '');
    saveShops();
    openShopEditor(shop);
  }
});
map.on('dblclick', (e) => {
  if (!drawMode) return;
  L.DomEvent.stop(e);
  activePoints.pop(); // the second click of the double-click added a redundant point
  finishActiveLine();
});
document.addEventListener('keydown', (e) => {
  if (!drawMode) return;
  if (e.key === 'Escape') { activePoints = []; renderActiveLine(); }
  else if (e.key === 'Enter') finishActiveLine();
});

drawToggleBtn.addEventListener('click', () => setDrawMode(!drawMode));
drawFinishBtn.addEventListener('click', finishActiveLine);
drawUndoBtn.addEventListener('click', undoPoint);
shopToggleBtn.addEventListener('click', () => setShopMode(!shopMode));

// Both "Clear all" buttons need a second click within a few seconds to
// confirm, so a stray click doesn't wipe out drawn work.
function armTwiceConfirm(button, defaultText, confirmText, onConfirm) {
  let armed = false;
  let armTimeout = null;
  button.addEventListener('click', () => {
    if (!armed) {
      armed = true;
      button.textContent = confirmText;
      armTimeout = setTimeout(() => {
        armed = false;
        button.textContent = defaultText;
      }, 3000);
      return;
    }
    clearTimeout(armTimeout);
    armed = false;
    button.textContent = defaultText;
    onConfirm();
  });
}
armTwiceConfirm(drawClearBtn, 'Clear all', 'Click again to confirm', clearAllBorders);
armTwiceConfirm(document.getElementById('shopClear'), 'Clear all shops', 'Click again to confirm', clearAllShops);

document.getElementById('drawExport').addEventListener('click', exportBorders);
document.getElementById('shopExport').addEventListener('click', exportShops);

// --- Search ---------------------------------------------------------
// Searches labeled borders and shops by substring match and zooms the map
// to a close-up view of whichever result is picked. The index is rebuilt
// from the live `borders`/`shops` arrays on every keystroke rather than
// cached, since both can change at any time while editing.
const DETAIL_ZOOM = 13;
const appHeaderEl = document.getElementById('appHeader');
const searchWrapEl = document.getElementById('searchWrap');
const searchIconBtn = document.getElementById('searchIconBtn');
const searchCloseBtn = document.getElementById('searchCloseBtn');
const searchInput = document.getElementById('searchInput');
const searchResultsEl = document.getElementById('searchResults');
let currentResults = [];
let searchActiveIndex = -1;

// Collapsed to just the icon button by default. Expanding it takes over
// the header -- the logo and "Return to spawn" button hide (see
// #appHeader.search-open in the CSS) so the search box has room to grow.
function openSearch() {
  searchWrapEl.classList.add('expanded');
  appHeaderEl.classList.add('search-open');
  searchInput.focus();
}
function closeSearch() {
  searchWrapEl.classList.remove('expanded');
  appHeaderEl.classList.remove('search-open');
  searchInput.value = '';
  closeSearchResults();
  searchInput.blur();
}
searchIconBtn.addEventListener('click', openSearch);
searchCloseBtn.addEventListener('click', closeSearch);

function buildSearchIndex() {
  const idx = [];
  for (const b of borders) if (b.label) idx.push({ type: 'border', label: b.label, color: b.color, ref: b });
  for (const s of shops) if (s.label) idx.push({ type: 'shop', label: s.label, ref: s });
  return idx;
}

function renderSearchResults(query) {
  const q = query.trim().toLowerCase();
  if (!q) { closeSearchResults(); return; }

  currentResults = buildSearchIndex()
    .filter((r) => r.label.toLowerCase().includes(q))
    .slice(0, 8);
  searchActiveIndex = currentResults.length ? 0 : -1;

  searchResultsEl.innerHTML = currentResults.length
    ? currentResults.map((r, i) => {
        const icon = r.type === 'border'
          ? `<span class="result-icon" style="background:${r.color}"></span>`
          : `<img class="result-icon shop-marker-icon" src="assets/shop-icon.png" alt="">`;
        return `<div class="search-result${i === 0 ? ' active' : ''}" data-index="${i}">${icon}${escapeHtml(r.label)}</div>`;
      }).join('')
    : `<div class="search-empty">No matches</div>`;

  searchResultsEl.querySelectorAll('.search-result').forEach((el) => {
    el.addEventListener('click', () => selectSearchResult(Number(el.dataset.index)));
  });
  searchResultsEl.classList.add('open');
}

function closeSearchResults() {
  searchResultsEl.classList.remove('open');
  searchResultsEl.innerHTML = '';
  currentResults = [];
  searchActiveIndex = -1;
}

function moveSearchActive(delta) {
  if (!currentResults.length) return;
  searchActiveIndex = (searchActiveIndex + delta + currentResults.length) % currentResults.length;
  searchResultsEl.querySelectorAll('.search-result').forEach((el, i) => {
    el.classList.toggle('active', i === searchActiveIndex);
  });
}

function selectSearchResult(i) {
  const r = currentResults[i];
  if (!r) return;
  if (r.type === 'border') {
    map.fitBounds(r.ref.layer.getBounds(), { maxZoom: DETAIL_ZOOM, padding: [60, 60] });
  } else {
    map.setView(worldToLatLng(r.ref.x, r.ref.z), DETAIL_ZOOM);
  }
  closeSearch();
}

searchInput.addEventListener('input', () => renderSearchResults(searchInput.value));
searchInput.addEventListener('focus', () => { if (searchInput.value) renderSearchResults(searchInput.value); });
searchInput.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if (e.key === 'ArrowDown') { e.preventDefault(); moveSearchActive(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearchActive(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (searchActiveIndex >= 0) selectSearchResult(searchActiveIndex); }
  else if (e.key === 'Escape') { closeSearch(); }
});
document.addEventListener('click', (e) => {
  if (searchWrapEl.classList.contains('expanded') && !searchWrapEl.contains(e.target)) closeSearch();
});

loadBorders();
loadShops();

footerSeedEl.textContent = 'loading wasm…';
createCubiomesModule().then((mod) => {
  cubiomes = mod;
  loadSeed(SEED);
});
</script>
</body>
