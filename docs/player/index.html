<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Player · Voxel</title>
    <meta name="theme-color" content="#faf5ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="../assets/favicon.png?v=ad829b4b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/brand.css?v=f4ed1d87" />
    <link rel="stylesheet" href="../assets/site.css?v=d9c39fe3" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="../" aria-label="Voxel, home">
          <picture>
            <source
              srcset="../assets/logo-mark-reversed-small.png?v=c3c00a88"
              media="(prefers-color-scheme: dark)"
            />
            <img
              class="brand__mark"
              src="../assets/logo-mark-small.png?v=800d40a4"
              alt=""
              width="36"
              height="36"
            />
          </picture>
          <span class="brand__name">Voxel</span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="nav-toggle__open" d="M3 6h18M3 12h18M3 18h18" />
            <path class="nav-toggle__close" d="M5 5l14 14M19 5L5 19" />
          </svg>
        </button>
        <nav class="nav" id="site-nav" aria-label="Main">
          <a href="../">
            <img
              class="nav__icon"
              src="../assets/icons/nav/village.png?v=328b0ab3"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Home</span>
          </a>
          <a href="../map/">
            <img
              class="nav__icon"
              src="../assets/icons/nav/map.png?v=b6a9cf2e"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Map</span>
          </a>
          <a href="../players/" aria-current="page">
            <img
              class="nav__icon"
              src="../assets/icons/nav/steve.png?v=717ed7db"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Players</span>
          </a>
          <a href="../shops/">
            <img
              class="nav__icon"
              src="../assets/icons/nav/diamond.png?v=f095b32b"
              alt=""
              width="32"
              height="32"
            />
            <span class="nav__label">Shops</span>
          </a>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="wrap" id="page">
        <p class="sr-only">Loading the player</p>
        <div class="page-head" aria-hidden="true">
          <div class="phero">
            <span class="skel skel--face"></span>
            <span class="skel skel--title"></span>
          </div>
        </div>
        <div class="tiles tiles--2" aria-hidden="true">
          <div class="skel skel--tile"></div>
          <div class="skel skel--tile"></div>
        </div>
        <div class="pgrid" aria-hidden="true">
          <div class="skel skel--card"></div>
          <div class="skel skel--card"></div>
        </div>
      </div>
    </main>

    <script type="module" src="../js/nav.js?v=0aa91664"></script>
    <script type="module" src="../js/player.js?v=dc34c526"></script>
  </body>
</html>
