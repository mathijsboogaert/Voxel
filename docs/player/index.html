<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Player · Voxel</title>
    <meta name="theme-color" content="#faf5ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="../assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/brand.css" />
    <link rel="stylesheet" href="../assets/site.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="../" aria-label="Voxel, home">
          <img class="brand__mark mark--light" src="../assets/logo-mark.png" alt="" width="36" height="36" />
          <img
            class="brand__mark mark--dark"
            src="../assets/logo-mark-reversed.png"
            alt=""
            width="36"
            height="36"
          />
          <span class="brand__name">Voxel</span>
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="nav-toggle__open" d="M3 6h18M3 12h18M3 18h18" />
            <path class="nav-toggle__close" d="M5 5l14 14M19 5L5 19" />
          </svg>
        </button>
        <nav class="nav" id="site-nav" aria-label="Main">
          <a href="../">
            <img class="nav__icon" src="../assets/icons/nav/village.png" alt="" width="32" height="32" />
            <span class="nav__label">Home</span>
          </a>
          <a href="../map/">
            <img class="nav__icon" src="../assets/icons/nav/map.png" alt="" width="32" height="32" />
            <span class="nav__label">Map</span>
          </a>
          <a href="../players/" aria-current="page">
            <img class="nav__icon" src="../assets/icons/nav/steve.png" alt="" width="32" height="32" />
            <span class="nav__label">Players</span>
          </a>
          <a href="../shops/">
            <img class="nav__icon" src="../assets/icons/nav/diamond.png" alt="" width="32" height="32" />
            <span class="nav__label">Shops</span>
          </a>
        </nav>
      </div>
    </header>

    <main>
      <div class="wrap" id="page">
        <p class="small pad-block-5">Loading the player</p>
      </div>
    </main>

    <script type="module" src="../js/nav.js"></script>
    <script type="module" src="../js/player.js"></script>
  </body>
</html>
