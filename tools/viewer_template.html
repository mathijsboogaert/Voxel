<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seed Viewer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1d2025;
    --border: #2c3038;
    --text: #e6e8eb;
    --muted: #9aa0a8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app { position: relative; width: 100%; height: 100%; }
  #viewport {
    position: absolute; inset: 0;
    overflow: hidden;
    cursor: grab;
    background: #05060a;
  }
  #viewport.dragging { cursor: grabbing; }
  #world {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
    image-rendering: pixelated;
  }
  #world img { display: block; image-rendering: pixelated; }
  #spawnMarker {
    position: absolute;
    width: 18px; height: 18px;
    margin-left: -9px; margin-top: -9px;
    pointer-events: none;
  }
  #spawnMarker svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 2px rgba(0,0,0,.8)); }

  #panel {
    position: absolute; top: 16px; left: 16px;
    background: rgba(29,32,37,0.92);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    max-width: 300px;
    backdrop-filter: blur(6px);
  }
  #panel h1 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
  #panel .meta { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
  #panel .meta b { color: var(--text); font-weight: 500; }
  #legend { max-height: 42vh; overflow-y: auto; font-size: 12px; }
  #legend .row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  #legend .swatch { width: 11px; height: 11px; border-radius: 2px; flex: none; border: 1px solid rgba(255,255,255,0.15); }
  #legend .name { flex: 1; }
  #legend .pct { color: var(--muted); }

  #coords {
    position: absolute; bottom: 16px; left: 16px;
    background: rgba(29,32,37,0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
  }
  #hint {
    position: absolute; bottom: 16px; right: 16px;
    font-size: 11px; color: var(--muted);
    background: rgba(29,32,37,0.7);
    border-radius: 8px; padding: 6px 10px;
  }
  #zoomControls {
    position: absolute; top: 16px; right: 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #zoomControls button {
    width: 32px; height: 32px;
    background: rgba(29,32,37,0.92);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }
  #zoomControls button:hover { background: #2a2e35; }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="world">
      <img id="biomeImage" src="__IMAGE_FILENAME__" draggable="false" alt="biome map">
      <div id="spawnMarker">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8 2 5 5.2 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.8-3-7-7-7z" fill="#ff4d4f" stroke="#fff" stroke-width="1.2"/>
          <circle cx="12" cy="9" r="2.6" fill="#fff"/>
        </svg>
      </div>
    </div>
  </div>

  <div id="panel">
    <h1>Seed __SEED__</h1>
    <div class="meta">
      <div><b>Minecraft:</b> __MC_VERSION__</div>
      <div><b>Spawn:</b> X __SPAWN_X__, Z __SPAWN_Z__</div>
      <div><b>Scale:</b> 1 pixel = __BLOCKS_PER_PIXEL__ blocks</div>
    </div>
    <div id="legend"></div>
  </div>

  <div id="coords">hover the map</div>
  <div id="hint">drag to pan · scroll to zoom</div>
  <div id="zoomControls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">&minus;</button>
    <button id="zoomReset">&#8962;</button>
  </div>
</div>

<script>
const DATA = __DATA_JSON__;

const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
const img = document.getElementById('biomeImage');
const marker = document.getElementById('spawnMarker');
const coordsEl = document.getElementById('coords');
const legendEl = document.getElementById('legend');

let scale = 1, minScale = 0.2, maxScale = 16;
let tx = 0, ty = 0;
let dragging = false, lastX = 0, lastY = 0;

function worldToImagePx(wx, wz) {
  const bpp = DATA.image.blocksPerPixel;
  return {
    x: (wx - DATA.region.x0) / bpp,
    y: (wz - DATA.region.z0) / bpp,
  };
}

function applyTransform() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function fitToViewport() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const iw = DATA.image.width, ih = DATA.image.height;
  scale = Math.min(vw / iw, vh / ih) * 0.95;
  tx = (vw - iw * scale) / 2;
  ty = (vh - ih * scale) / 2;
  applyTransform();
}

function placeSpawnMarker() {
  const p = worldToImagePx(DATA.spawn.x, DATA.spawn.z);
  marker.style.left = p.x + 'px';
  marker.style.top = p.y + 'px';
}

function zoomAt(factor, clientX, clientY) {
  const rect = viewport.getBoundingClientRect();
  const mx = clientX - rect.left, my = clientY - rect.top;
  const newScale = Math.min(maxScale, Math.max(minScale, scale * factor));
  const ratio = newScale / scale;
  tx = mx - (mx - tx) * ratio;
  ty = my - (my - ty) * ratio;
  scale = newScale;
  applyTransform();
}

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  zoomAt(factor, e.clientX, e.clientY);
}, { passive: false });

viewport.addEventListener('mousedown', (e) => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  viewport.classList.add('dragging');
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); });
window.addEventListener('mousemove', (e) => {
  if (dragging) {
    tx += e.clientX - lastX;
    ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
  }
  const rect = viewport.getBoundingClientRect();
  const ix = (e.clientX - rect.left - tx) / scale;
  const iy = (e.clientY - rect.top - ty) / scale;
  const bpp = DATA.image.blocksPerPixel;
  const wx = Math.round(DATA.region.x0 + ix * bpp);
  const wz = Math.round(DATA.region.z0 + iy * bpp);
  coordsEl.textContent = `X ${wx}, Z ${wz}`;
});

document.getElementById('zoomIn').onclick = () => {
  const r = viewport.getBoundingClientRect();
  zoomAt(1.4, r.left + r.width / 2, r.top + r.height / 2);
};
document.getElementById('zoomOut').onclick = () => {
  const r = viewport.getBoundingClientRect();
  zoomAt(1 / 1.4, r.left + r.width / 2, r.top + r.height / 2);
};
document.getElementById('zoomReset').onclick = fitToViewport;

function buildLegend() {
  const items = [...DATA.legend].sort((a, b) => b.percent - a.percent);
  legendEl.innerHTML = items.map(it => `
    <div class="row">
      <div class="swatch" style="background:${it.color}"></div>
      <div class="name">${it.name.replaceAll('_', ' ')}</div>
      <div class="pct">${it.percent.toFixed(1)}%</div>
    </div>
  `).join('');
}

img.onload = () => {
  world.style.width = DATA.image.width + 'px';
  world.style.height = DATA.image.height + 'px';
  fitToViewport();
  placeSpawnMarker();
};
window.addEventListener('resize', fitToViewport);
buildLegend();
</script>
</body>
</html>
